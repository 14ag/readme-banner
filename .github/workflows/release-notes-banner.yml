name: Update Latest Release Notes

on:
  workflow_call:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: latest } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            if (latest.id === context.payload.release.id) {
              const body = context.payload.release.body || '';
              const banner = `![Banner](https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/banner/banner.webp)`;
              if (!body.startsWith(banner)) {
                await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: latest.id,
                  body: banner + '\n\n' + body,
                });
              }
            }
