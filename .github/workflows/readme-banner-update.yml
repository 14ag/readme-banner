name: Update Banner

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      VERCEL_URL:
        required: true
        type: string
    secrets:
      BANNER_KEY:
        required: true
  schedule:
    # runs every 24 hours at 0900hrs
    - cron: "0 9 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-banner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Ensure README contains banner
        shell: bash
        run: |
          BANNER="![Banner](https://raw.githubusercontent.com/${{ github.repository }}/banner/banner.webp)"

          # Create README if it doesn't exist
          touch README.md

          # Only prepend if the banner isn't already present anywhere
          if ! grep -Fxq "$BANNER" README.md; then
            {
              printf '%s\n\n' "$BANNER"
              cat README.md
            } > README.md.tmp
            mv README.md.tmp README.md

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: add banner to README"
            git push
          fi

      - name: Fetch banner image from backend
        env:
          BANNER_KEY: ${{ secrets.BANNER_KEY }}
        run: |
          VERCEL_URL="${{ vars.VERCEL_URL }}"
          curl -sf \
            -H "X-Banner-Key: ${BANNER_KEY}" \
            -H "repo-name: ${{ github.event.repository.name }}" \
            "${VERCEL_URL}/banner" \
            --output /tmp/banner.webp

      - name: Commit and push if anything changed
        run: |
          COMMIT_MESSAGE="chore: rotate banner"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin banner >/dev/null 2>&1; then
            git fetch --depth=1 origin banner
            git checkout -B banner origin/banner
          else
            git checkout --orphan banner
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mv /tmp/banner.webp banner.webp
          git add banner.webp
          git diff --cached --quiet && exit 0

          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git commit --amend --no-edit --allow-empty
            git push --force-with-lease origin banner
          else
            git commit -m "$COMMIT_MESSAGE"
            git push origin banner
          fi
